# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
# Deploys a PREVIEW channel for each pull request to the main branch. The preview channel will expire after 30 days.
name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches: [main]
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TERMINALWEBAPP }}
          expires: 30d
          projectId: terminalwebapp
          target: agendaclock
